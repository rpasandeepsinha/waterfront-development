# Welcome to Mago!
# For full documentation, see https://mago.carthage.software/tools/overview
php-version = "8.4.0"

[source]
workspace = "."
paths = ["src/", "config/", "database/", "routes/", "tests/"]
includes = ["vendor"]
excludes = ["storage/", "bootstrap/", "vendor/bin/", "tests/PhpStan/", "public/"]

[formatter]
preset = "psr-12"
method-brace-style = "next-line"
preserve-breaking-argument-list = true
empty-line-before-return = true
space-after-logical-not-unary-prefix-operator = true
empty-line-after-control-structure = true
first-method-chain-on-new-line = false
space-before-arrow-function-parameter-list-parenthesis = true
print-width = 120
control-brace-style = "same-line"
space-around-assignment-in-declare = false
sort-uses = true
trailing-comma = true
space-after-cast-unary-prefix-operators = true
space-within-grouping-parenthesis = false
separate-use-types = false
indent-heredoc = false


[linter]
baseline = "mago-linter-baseline.toml"
integrations = ["symfony", "laravel", "phpunit"]

[linter.rules]
ambiguous-function-call = { enabled = false }
literal-named-argument = { enabled = false }
assert-description = { enabled = false}
excessive-parameter-list = { enabled = false }
final-controller = { enabled = false }
halstead = { volume-threshold = 2000, difficulty-threshold = 20, effort-threshold = 20000 }
cyclomatic-complexity = { enabled = false }
too-many-methods = { enabled = false }
kan-defect = { enabled = false }
no-literal-password = { enabled = false }
sensitive-parameter = { enabled = false }
no-insecure-comparison = { enabled = false }
too-many-enum-cases = { enabled = false }
braced-string-interpolation = { enabled = false }
readable-literal = { enabled = false }
tagged-todo = { enabled = false }
prefer-static-closure = { enabled = false }
prefer-early-continue = { enabled = false }
inline-variable-return = { enabled = false }
assertion-style = { enabled = false }
no-empty-catch-clause = { enabled = false, level = "error" }
no-assign-in-argument = { enabled = true }
no-dead-store = { enabled = true }
no-redundant-variable = { enabled = true }
no-unused-closure-capture = { enabled = true }
no-unused-static = { enabled = true }
no-unused-global = { enabled = true }
switch-continue-to-break = { enabled = true }
no-debug-symbols = { level = "error" }

