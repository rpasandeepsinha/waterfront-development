# Replaces phpstan.neon.dist `disallowedClasses`.
# Note: only catches `new ClassName(...)` direct instantiation, but gives a better message there.
# Static calls (Mockery::mock, Carbon::now, ...) are covered by [guard.perimeter.restrictions] below.
[linter.rules.disallowed-type-instantiation]
enabled = true
level = "error"
types = [
  { name = "Mockery", help = "Mockery should not be used, please use PHPUnit for mocking" },
  { name = "Carbon\\Carbon", help = "Carbon is mutable, please use CarbonImmutable instead." },
  { name = "Illuminate\\Support\\Carbon", help = "Carbon is mutable, please use CarbonImmutable instead." },
]

[analyzer]
baseline = "mago-analyzer-baseline.toml"
plugins = []
find-unused-definitions = true
find-unused-expressions = true
analyze-dead-code = true
memoize-properties = true
check-throws = false
check-missing-override = true
find-unused-parameters = true
strict-list-index-checks = true
strict-array-index-existence = true
no-boolean-literal-comparison = true
check-missing-type-hints = true
check-closure-missing-type-hints = true
check-arrow-function-missing-type-hints = true
check-use-statements = true
check-name-casing = true
check-property-initialization = true
find-overly-wide-return-types = true
register-super-globals = false
# enforce-class-finality is intentionally left unset (defaults to false): it reports classes that are
# NOT final, the inverse of what this project enforces. See [[guard.structural.rules]] below.
unchecked-exceptions = ["LogicException"]
class-initializers = [
  "PHPUnit\\Framework\\TestCase::setUp",
  "PHPUnit\\Framework\\TestCase::setUpBeforeClass",
]
ignore = [
    "missing-override-attribute",
    "possibly-undefined-int-array-index",
    "possibly-undefined-string-array-index",
    "avoid-catching-error", #why would we not catch errors ?
  { code = "missing-return-type", in = ["tests/", "database/"] },
  # False positive: Factory::$model has no native type, so PHP invariance does not apply, and the
  # child already binds TModel through `@extends Factory<Model>`. Reported against the vendor file,
  # so a @mago-expect pragma in the factory cannot attach to it.
  { code = "incompatible-property-type", pattern = 'Tests\\Factories\\\w+::\$model' },
]

# Replaces phpstan.neon.dist `disallowedClasses` for everything that is not a `new` expression:
# static calls (Mockery::mock, Carbon::now), use statements, type hints and facade access.
[guard]
mode = "default"

[[guard.perimeter.restrictions]]
# Mockery should not be used, please use PHPUnit for mocking.
dependency = "Mockery\\**"
deny-from = ["App\\", "Tests\\", "Database\\", "@global"]

[[guard.perimeter.restrictions]]
# Carbon is mutable, please use CarbonImmutable instead.
dependency = "Carbon\\Carbon"
deny-from = ["App\\", "Tests\\", "Database\\", "@global"]

[[guard.perimeter.restrictions]]
# Carbon is mutable, please use CarbonImmutable instead.
dependency = "Illuminate\\Support\\Carbon"
deny-from = ["App\\", "Tests\\", "Database\\", "@global"]

[[guard.perimeter.restrictions]]
# Deprecated Laravel facade, construct a new Response instead.
dependency = "Illuminate\\Support\\Facades\\Response"
deny-from = ["App\\", "Tests\\", "Database\\", "@global"]

# Replaces the first half of tests/PhpStan/NoFinalClassesAndOnlyAllowClassExtendingOnAbstractClasses.
# The second half (may only extend abstract classes) has no Mago equivalent and stays in PHPStan.
[[guard.structural.rules]]
on = "App\\**"
target = "class"
must-be-final = false
reason = "Making a class final is not allowed, it prevents mocking in testing."
