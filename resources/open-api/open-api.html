
<!-- HTML for static distribution bundle build -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenAPI test</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700|Source+Code+Pro:300,600|Titillium+Web:400,600,700" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="//unpkg.com/swagger-ui-dist@3/swagger-ui.css" >
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <style>
        html
        {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *,
        *:before,
        *:after
        {
            box-sizing: inherit;
        }

        body {
            margin:0;
            background: #fafafa;
        }
    </style>
</head>

<body>

<form id="validation" novalidate onsubmit="return false" style="display: none">
    <input type="text" name="client_id" />
    <input type="text" name="secret" />
    <input type="submit"/>
</form>

<div id="swagger-ui"></div>

<script src="//unpkg.com/swagger-ui-dist@3/swagger-ui-bundle.js"></script>
<script>
    window.onload = function() {
        // Build a system
        const ui = SwaggerUIBundle({
            dom_id: '#swagger-ui',

            url: "{{ url }}",
            docExpansion: 'none',

            displayRequestDuration: true,

            requestInterceptor: function(s) {
                console.log(s);
                return this;
            },

            onComplete: function () {
                // TODO: make the form with client id and secret work by doing the login_token action and calling
                // preauthorizeApiKey
                //document.querySelector('#validation').removeAttribute('style');
                //ui.specActions.execute({operation: ?, path: '/login_token', method: 'post'})
                //ui.preauthorizeApiKey("bearerAuth", tokenValue);
            },

            presets: [
                SwaggerUIBundle.presets.apis,
            ],

            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl
            ],
        });

        window.ui = ui
    }

</script>
</body>

</html>
